<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkGuard Admin</title>
<style>
:root{
  --bg:#eef1f5;--panel:#fff;--ink:#14202e;--mute:#5d6b7c;--line:#d5dbe3;
  --sign:#0b4ea2;--sign-ink:#fff;--ok:#1b7f4b;--warn:#b86e00;--bad:#c0392b;
  --okbg:#e3f4ea;--warnbg:#fdf0d8;--badbg:#fbe4e1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1620;--panel:#18222e;--ink:#e8edf3;--mute:#93a1b2;--line:#2a3745;
  --sign:#2f7be0;--sign-ink:#fff;--ok:#58c58d;--warn:#e8a64a;--bad:#f0776a;
  --okbg:#17382a;--warnbg:#3b2d12;--badbg:#401e1b;color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav{background:var(--sign);color:var(--sign-ink);padding:1.2rem .8rem;display:flex;flex-direction:column;gap:.2rem}
nav h1{font-size:1.15rem;margin:0 0 1rem;padding:0 .6rem;display:flex;align-items:center;gap:.6rem}
.plogo{width:2rem;height:2rem;border-radius:6px;background:#fff;color:var(--sign);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
nav button{background:none;border:0;color:inherit;text-align:left;padding:.6rem .7rem;border-radius:8px;cursor:pointer;opacity:.85}
nav button:hover{background:#ffffff22;opacity:1}
nav button[aria-current=true]{background:#fff;color:var(--sign);opacity:1;font-weight:650}
nav .spacer{flex:1}
main{padding:1.5rem;max-width:1100px;width:100%}
h2{margin:0 0 1rem;font-size:1.4rem}
.stats{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.2rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;min-width:130px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.85rem}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.82rem;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.plate{font-weight:700;letter-spacing:.06em;border:2px solid var(--ink);border-radius:5px;padding:.05rem .45rem;background:var(--panel)}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.82rem;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.neutral{background:var(--bg);color:var(--mute)}
.bar{width:110px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:.5rem}
.bar i{display:block;height:100%}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:.3rem .65rem;cursor:pointer;margin-right:.3rem}
.btn:hover{border-color:var(--sign)}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.danger{color:var(--bad)}
.empty{padding:2rem;text-align:center;color:var(--mute)}
form.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2rem;display:grid;gap:.9rem;max-width:560px}
label{display:grid;gap:.25rem;font-weight:600}
label small{font-weight:400;color:var(--mute)}
input,select{padding:.5rem .6rem;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:1rem;max-width:90vw}
dialog img{max-width:100%;max-height:70vh;display:block;margin-bottom:.8rem}
#login{display:grid;place-items:center;min-height:100%}
[hidden]{display:none !important}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav{flex-direction:row;flex-wrap:wrap;padding:.6rem}
  nav h1{width:100%;margin:0 0 .3rem}
  nav .spacer{display:none}
  main{padding:1rem}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" onsubmit="doLogin(event)">
    <h2>ParkGuard Admin</h2>
    <label>Admin-Schlüssel<input id="key" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Anmelden</button>
    <small id="loginErr" style="color:var(--bad)"></small>
  </form>
</div>

<div class="app" id="app" hidden>
  <nav aria-label="Hauptmenü">
    <h1><span class="plogo">P</span>ParkGuard</h1>
    <button data-v="parked">Geparkt</button>
    <button data-v="fines">Strafen</button>
    <button data-v="history">Verlauf</button>
    <button data-v="whitelist">Ausnahmen</button>
    <button data-v="settings">Einstellungen</button>
    <span class="spacer"></span>
    <button onclick="logout()">Abmelden</button>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>

<dialog id="dlg"><img id="dlgImg" alt="Beweisfoto der Einfahrt"><button class="btn" onclick="dlg.close()">Schließen</button></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = c => (c/100).toFixed(2).replace(".", ",") + " €";
const fmt = ts => ts ? new Date(ts*1000).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}) : "–";
const dur = sec => { sec=Math.max(0,Math.round(sec/60)); return Math.floor(sec/60)+" h "+String(sec%60).padStart(2,"0")+" min"; };
let KEY = sessionStorage.getItem("pgkey") || "", view = "parked", timer = null, cfg = {};

async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers:{"X-Admin-Key":KEY,"Content-Type":"application/json",...(opts.headers||{})}});
  if (r.status === 401) { logout(); throw new Error("Nicht angemeldet"); }
  if (!r.ok) throw new Error("Fehler " + r.status);
  return r;
}
const getJSON = async p => (await api(p)).json();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

async function doLogin(e){
  e.preventDefault(); KEY = $("#key").value;
  try { await getJSON("/api/admin/settings"); sessionStorage.setItem("pgkey", KEY); start(); }
  catch { $("#loginErr").textContent = "Schlüssel ist falsch."; }
}
function logout(){ sessionStorage.removeItem("pgkey"); KEY=""; clearInterval(timer); $("#app").hidden=true; $("#login").hidden=false; }
async function start(){ $("#login").hidden=true; $("#app").hidden=false; show(view); }

document.querySelectorAll("nav [data-v]").forEach(b => b.onclick = () => show(b.dataset.v));
async function show(v){
  view = v; clearInterval(timer);
  document.querySelectorAll("nav [data-v]").forEach(b => b.setAttribute("aria-current", b.dataset.v===v));
  await render();
  if (v==="parked") timer = setInterval(render, 15000);
}
async function render(){
  try { cfg = await getJSON("/api/admin/settings"); await views[view](); } catch(e){ if(KEY) $("#view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
const deadline = (s) => s.entry_ts + (+cfg.free_minutes)*60 + s.paid_hours*3600;
const table = (head, rows, empty) => rows.length
  ? `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
  : `<div class="tablewrap"><div class="empty">${empty}</div></div>`;
const plate = p => `<span class="plate">${esc(p)}</span>`;

const views = {
  async parked(){
    const [ss, fs] = await Promise.all([getJSON("/api/admin/sessions"), getJSON("/api/admin/fines")]);
    const open = ss.filter(s => s.status==="open"), now = Date.now()/1000;
    const fined = new Set(fs.filter(f=>!f.voided).map(f=>f.session_id));
    const over = open.filter(s => now > deadline(s)).length;
    const unpaid = fs.filter(f=>!f.voided && !f.paid_ts);
    const rows = open.map(s => {
      const total = deadline(s) - s.entry_ts, used = now - s.entry_ts, left = deadline(s) - now;
      const pct = Math.min(100, used/total*100);
      const col = left < 0 ? "var(--bad)" : pct > 80 ? "var(--warn)" : "var(--ok)";
      const state = s.fine_waived ? '<span class="badge neutral">Ausgenommen</span>'
        : fined.has(s.id) ? '<span class="badge bad">Strafe ausgestellt</span>'
        : left < 0 ? '<span class="badge bad">Zeit überschritten</span>' : '<span class="badge ok">Im Rahmen</span>';
      return `<tr><td>${plate(s.plate)}</td><td>${fmt(s.entry_ts)}</td>
        <td><span class="bar"><i style="width:${pct}%;background:${col}"></i></span>${left<0 ? "+"+dur(-left) : dur(left)+" übrig"}</td>
        <td>${state}</td>
        <td>${s.entry_image?`<button class="btn" onclick="showImg(${s.id})">Foto</button>`:""}${s.fine_waived?"":`<button class="btn" onclick="waive(${s.id})">Nicht bestrafen</button>`}</td></tr>`;
    });
    $("#view").innerHTML = `<h2>Gerade geparkt</h2>
      <div class="stats"><div class="stat"><b>${open.length}</b><span>Autos auf dem Platz</span></div>
      <div class="stat"><b>${over}</b><span>Zeit überschritten</span></div>
      <div class="stat"><b>${unpaid.length}</b><span>Offene Strafen (${eur(unpaid.reduce((a,f)=>a+f.amount_cents,0))})</span></div></div>`
      + table(["Kennzeichen","Einfahrt","Restzeit","Status",""], rows, "Aktuell steht kein Auto auf dem Platz.");
  },
  async fines(){
    const fs = await getJSON("/api/admin/fines");
    const rows = fs.map(f => {
      const st = f.voided ? '<span class="badge neutral">Storniert</span>' : f.paid_ts ? '<span class="badge ok">Bezahlt</span>' : '<span class="badge warn">Offen</span>';
      const acts = f.voided ? "" : `<button class="btn" onclick="openPdf(${f.id})">PDF</button>`
        + (f.paid_ts ? "" : `<button class="btn" onclick="finePaid(${f.id})">Als bezahlt markieren</button>`)
        + `<button class="btn danger" onclick="voidFine(${f.id})">Stornieren</button>`;
      return `<tr><td>PG-${String(f.id).padStart(6,"0")}</td><td>${plate(f.plate)}</td><td>${fmt(f.created_ts)}</td><td>${eur(f.amount_cents)}</td><td>${st}</td><td>${acts}</td></tr>`;
    });
    $("#view").innerHTML = `<h2>Strafen</h2>` + table(["Nr.","Kennzeichen","Ausgestellt","Betrag","Status",""], rows, "Es wurden noch keine Strafen ausgestellt.");
  },
  async history(){
    const ss = await getJSON("/api/admin/sessions");
    const rows = ss.map(s => `<tr><td>${plate(s.plate)}</td><td>${fmt(s.entry_ts)}</td><td>${fmt(s.exit_ts)}</td>
      <td>${dur((s.exit_ts||Date.now()/1000)-s.entry_ts)}</td><td>${s.paid_hours} h bezahlt</td>
      <td>${s.status==="open"?'<span class="badge warn">Parkt</span>':'<span class="badge neutral">Ausgefahren</span>'}</td></tr>`);
    $("#view").innerHTML = `<h2>Verlauf</h2>` + table(["Kennzeichen","Einfahrt","Ausfahrt","Dauer","Bezahlt","Status"], rows, "Noch keine Fahrzeuge erfasst.");
  },
  async whitelist(){
    const w = await getJSON("/api/admin/whitelist");
    const rows = w.map(x => `<tr><td>${plate(x.plate)}</td><td>${esc(x.note)}</td><td><button class="btn danger" onclick="wlDel('${esc(x.plate)}')">Entfernen</button></td></tr>`);
    $("#view").innerHTML = `<h2>Ausnahmen</h2>
      <form class="row" onsubmit="wlAdd(event)">
        <label>Kennzeichen<input id="wp" required placeholder="BN AB 123"></label>
        <label>Notiz<input id="wn" placeholder="z. B. Mitarbeiter"></label>
        <button class="btn primary" type="submit">Hinzufügen</button></form>`
      + table(["Kennzeichen","Notiz",""], rows, "Keine Ausnahmen. Fahrzeuge auf dieser Liste werden nie bestraft.");
  },
  async settings(){
    const c = cfg;
    $("#view").innerHTML = `<h2>Einstellungen</h2>
    <form class="card" onsubmit="saveCfg(event)">
      <label>Erlaubte Parkdauer (Minuten)<small>Danach beginnt die Gebühr, oder es wird bestraft.</small>
        <input id="f_free" type="number" min="0" value="${esc(c.free_minutes)}"></label>
      <label>Strafmodus<select id="f_mode">
        <option value="off">Nie bestrafen (nur Gebühr am Automaten)</option>
        <option value="on_overstay">Sofort bei Überschreitung</option>
        <option value="on_exit">Erst bei der Ausfahrt</option></select></label>
      <label>Strafbetrag (€)<input id="f_fine" type="number" min="0" step="0.01" value="${(c.fine_cents/100).toFixed(2)}"></label>
      <label>Gebühr pro angefangene Stunde (€)<small>Gilt nach Ablauf der erlaubten Parkdauer.</small>
        <input id="f_rate" type="number" min="0" step="0.01" value="${(c.rate_cents_per_hour/100).toFixed(2)}"></label>
      <label>Betreiber<input id="f_op" value="${esc(c.operator_name)}"></label>
      <label>Adresse des Betreibers<input id="f_addr" value="${esc(c.operator_address)}"></label>
      <button class="btn primary" type="submit">Änderungen speichern</button>
    </form>`;
    $("#f_mode").value = c.fine_mode;
  }
};

async function saveCfg(e){
  e.preventDefault();
  await api("/api/admin/settings", {method:"PUT", body: JSON.stringify({
    free_minutes: +$("#f_free").value, fine_mode: $("#f_mode").value,
    fine_cents: Math.round($("#f_fine").value*100), rate_cents_per_hour: Math.round($("#f_rate").value*100),
    operator_name: $("#f_op").value, operator_address: $("#f_addr").value })});
  toast("Gespeichert");
}
async function waive(id){ await api(`/api/admin/sessions/${id}/waive`, {method:"POST"}); toast("Dieses Auto wird nicht bestraft"); render(); }
async function voidFine(id){ if(!confirm("Strafe wirklich stornieren?")) return; await api(`/api/admin/fines/${id}/void`, {method:"POST"}); toast("Strafe storniert"); render(); }
async function finePaid(id){ await api(`/api/admin/fines/${id}/paid`, {method:"POST"}); toast("Als bezahlt markiert"); render(); }
async function wlAdd(e){ e.preventDefault(); await api("/api/admin/whitelist", {method:"POST", body: JSON.stringify({plate:$("#wp").value, note:$("#wn").value})}); toast("Hinzugefügt"); render(); }
async function wlDel(p){ await api("/api/admin/whitelist/"+encodeURIComponent(p), {method:"DELETE"}); toast("Entfernt"); render(); }
async function openPdf(id){
  const w = window.open("", "_blank");   // sofort öffnen, sonst blockiert der Browser das Popup
  try {
    const b = await (await api(`/api/admin/fines/${id}/pdf`)).blob();
    const url = URL.createObjectURL(new Blob([b], {type:"application/pdf"}));
    if (w) w.location.href = url; else location.href = url;
  } catch(e) { if (w) w.close(); toast("PDF konnte nicht geladen werden (" + e.message + ")"); }
}
async function showImg(id){ try { const b = await (await api(`/api/admin/sessions/${id}/image`)).blob(); $("#dlgImg").src = URL.createObjectURL(b); $("#dlg").showModal(); } catch { toast("Kein Foto vorhanden"); } }

if (KEY) start(); else $("#login").hidden = false;
</script>
</body>
</html>
